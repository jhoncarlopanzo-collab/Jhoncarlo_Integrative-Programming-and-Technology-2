<div class="main-container">

  <div class="overlay"></div>

  <!-- LOGIN -->
  <div *ngIf="!isSignUpMode" class="content-box">

    <h2>Login</h2>

    <form [formGroup]="loginForm">

      <input type="text" formControlName="username" placeholder="Username">
      <input type="password" formControlName="password" placeholder="Password">

    </form>

    <button (click)="login()">Login</button>
    <button class="portfolio-btn" [routerLink]="['/portfolio']">Go to Portfolio</button>
    <button (click)="toggleSignUp()">Go to Sign Up</button>

  </div>

  <!-- SIGN UP -->
  <div *ngIf="isSignUpMode" class="content-box">

    <h2>Sign Up</h2>

    <form [formGroup]="loginForm">

      <input type="text" formControlName="username" placeholder="Username">

      <div class="error" *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid">
        Username is required (min 3 characters)
      </div>
      <input type="email" formControlName="email" placeholder="Email">

      <div class="error" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
        Valid email is required
      </div>
      <input type="password" formControlName="password" placeholder="Password">

      <div class="error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
        Password must be 5–10 characters
      </div>
      <input type="password" formControlName="confirmPassword" placeholder="Confirm Password">

      <div class="error" *ngIf="loginForm.get('confirmPassword')?.touched && loginForm.get('confirmPassword')?.invalid">
        Confirm password is required
      </div>
      <div class="error"
  *ngIf="loginForm.value.password !== loginForm.value.confirmPassword && loginForm.get('confirmPassword')?.touched">
  Passwords do not match
</div>

    </form>

    <button (click)="register()">Register</button>
    <button (click)="toggleSignUp()">Back to Login</button>

  </div>

</div>

<!-- TABLE -->
<div *ngIf="users.length > 0" class="table-container">

  <h3>Registered Users</h3>

  <table class="user-table">
    <thead>
      <tr>
        <th>Username</th>
        <th>Email</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let user of users">
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
      </tr>
    </tbody>
  </table>

  <button (click)="clearTable()">Clear Users</button>

</div>
